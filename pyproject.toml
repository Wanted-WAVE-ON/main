[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-orchestra-2"
version = "0.1.0"
description = "Personalized Spatial Agent that learns a user's gesture language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "sqlalchemy==2.0.50",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-dotenv>=1.0.1",
  "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]
camera = ["opencv-python==4.13.0.92", "numpy==2.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
